name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Safe placeholders — src/lib/env.ts validates shape at build/test time
      # but nothing in the build or test suite makes a real Supabase call.
      # Real values live in Vercel's project env vars, not here.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-only
      VITE_FILM_AUTOSTART: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright smoke
        run: npx playwright test --project=chromium --project=webkit
