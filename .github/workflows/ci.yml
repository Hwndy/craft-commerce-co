name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      VITE_FILM_AUTOSTART: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom (vitest's test environment) depends on undici ^8, which
          # needs zlib/decompression APIs Node 20.x doesn't have — `npm run
          # test` crashed on every single CI run since T6 with "Cannot read
          # properties of undefined (reading 'bind')" in undici's decompress
          # interceptor, never caught because this was only ever verified
          # locally (Node 22) and never checked against real CI results. See
          # docs/decisions.md D-30.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, unit test
        env:
          # Safe placeholders — src/lib/env.ts validates shape at this stage
          # but nothing in typecheck/lint/unit-test makes a real Supabase
          # call. Real production values live in Vercel's project env vars.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-only
          VITE_OWNER_EMAIL: owner-ci@example.com
        run: |
          npm run typecheck
          npm run lint
          npm run test

      # The e2e specs (entry sequence, first-watch gate, /gallery axe,
      # orientation) need a real published film to render anything
      # meaningful, so the build below targets a local Supabase stack
      # seeded with a short synthetic test film — never the real staging
      # project (docs/decisions.md D-25/D-26).
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Record local Supabase connection details
        # `-o env` prints KEY="value" lines (plus the occasional stray
        # status line) — GITHUB_ENV needs bare KEY=value, one per line, so
        # strip the quotes and drop anything that isn't a KEY="..." line.
        run: |
          supabase status -o env | grep -E '^[A-Z_]+="' | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      # pgTAP (supabase/tests/) was never actually run in CI before D-46 —
      # every migration's RLS tests only ran ad hoc, locally. Each test file
      # runs in its own rolled-back transaction, scoped to its own
      # 'pgtap-test-%' fixtures, so this needs no seed data and can run
      # right after migrations apply.
      - name: pgTAP (RLS tests)
        run: supabase test db

      - name: Install ffmpeg and ImageMagick
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Generate and encode a short synthetic test film
        run: |
          scripts/generate-test-film.sh assets/test-source/test-film.mp4 20
          scripts/encode-hls.sh assets/test-source/test-film.mp4 assets/test-hls-output

      - name: Upload the test film to the local Supabase stack
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: npx tsx scripts/upload-film.ts assets/test-hls-output "ALL LIFE Test Film"

      # The collage specs (T8) need real published photos to render
      # anything meaningful, same reasoning as the test film above — a
      # small set of synthetic placeholder photos, never the real staging
      # project.
      - name: Generate and seed placeholder photos
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: |
          scripts/generate-placeholder-photos.sh assets/test-photos 8
          npx tsx scripts/seed-photos.ts assets/test-photos "ALL LIFE Test Shoot"

      # The shop specs (Phase 3 T2+) need a real published product to
      # render anything meaningful, same reasoning as the photos above —
      # reuses the same placeholder-image generator, never the real
      # staging project.
      - name: Generate and seed a placeholder product
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: |
          scripts/generate-placeholder-photos.sh assets/test-product-photos 1
          npx tsx scripts/seed-products.ts assets/test-product-photos

      - name: Build (against the local Supabase stack)
        env:
          VITE_SUPABASE_URL: ${{ env.API_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          # Not a real secret — the mailto: link's own recipient is always
          # visible in the page source regardless (see src/lib/env.ts's own
          # comment); CI just needs a syntactically valid address for T4's
          # e2e specs to assert against.
          VITE_OWNER_EMAIL: owner-ci@example.com
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright e2e
        # mobile-chrome/mobile-safari (playwright.config.ts) reuse the same
        # chromium/webkit binaries installed above, just with different
        # device emulation — no extra browser install needed.
        run: npx playwright test --project=chromium --project=webkit --project=mobile-chrome --project=mobile-safari

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
